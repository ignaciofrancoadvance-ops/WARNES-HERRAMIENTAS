<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Warnes Herramientas">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edf2"/>
      <stop offset="0.5" stop-color="#b9c4cf"/>
      <stop offset="1" stop-color="#8a97a4"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4e79"/>
      <stop offset="1" stop-color="#12324f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc32b"/>
      <stop offset="1" stop-color="#f39c0c"/>
    </linearGradient>
  </defs>

  <!-- Badge / shield -->
  <g transform="translate(180 178)">
    <path d="M0 -150 L118 -108 L118 40 C118 118 60 150 0 172 C-60 150 -118 118 -118 40 L-118 -108 Z"
          fill="url(#badge)" stroke="#0c2338" stroke-width="6"/>
    <path d="M0 -150 L118 -108 L118 40 C118 118 60 150 0 172 C-60 150 -118 118 -118 40 L-118 -108 Z"
          fill="none" stroke="#ffc32b" stroke-width="4" transform="scale(0.9)"/>

    <!-- Crossed wrench + hammer -->
    <g transform="rotate(0)">
      <!-- Wrench -->
      <g transform="rotate(-45)">
        <rect x="-14" y="-108" width="28" height="200" rx="14" fill="url(#steel)" stroke="#5b6773" stroke-width="3"/>
        <path d="M-30 -108 a30 30 0 1 0 60 0 l-16 0 a14 14 0 1 1 -28 0 z"
              fill="url(#steel)" stroke="#5b6773" stroke-width="3"/>
        <path d="M-30 108 a30 30 0 1 1 60 0 l-16 0 a14 14 0 1 0 -28 0 z"
              fill="url(#steel)" stroke="#5b6773" stroke-width="3"/>
      </g>
      <!-- Hammer -->
      <g transform="rotate(45)">
        <rect x="-9" y="-30" width="18" height="140" rx="8" fill="#8a5a2b" stroke="#5a3a19" stroke-width="3"/>
        <rect x="-52" y="-96" width="104" height="46" rx="10" fill="url(#steel)" stroke="#5b6773" stroke-width="3"/>
        <rect x="34" y="-92" width="26" height="38" rx="6" fill="url(#steel)" stroke="#5b6773" stroke-width="3"/>
      </g>
      <!-- Center bolt -->
      <circle cx="0" cy="0" r="20" fill="url(#bolt)" stroke="#b9770a" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#12324f"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(330 120)">
    <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-weight="900"
          font-size="72" fill="#12324f" letter-spacing="1">WARNES</text>
    <rect x="4" y="24" width="264" height="10" rx="5" fill="url(#bolt)"/>
    <text x="6" y="86" font-family="Arial, sans-serif" font-weight="700"
          font-size="34" fill="#5b6773" letter-spacing="8">HERRAMIENTAS</text>
    <text x="6" y="150" font-family="Arial, sans-serif" font-weight="600"
          font-size="20" fill="#8a97a4" letter-spacing="2">CALIDAD PROFESIONAL</text>
  </g>
</svg>
